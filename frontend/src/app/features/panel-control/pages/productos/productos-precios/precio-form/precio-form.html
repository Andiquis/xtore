<div class="product-form-backdrop" (click)="close.emit()">
  <section class="product-form-modal" (click)="$event.stopPropagation()">
    <header class="form-header">
      <div>
        <span class="form-eyebrow">{{ mode === 'create' ? 'Nuevo precio' : 'Editar precio' }}</span>
        <h2>{{ mode === 'create' ? 'Asignar precio' : 'Editar precio' }}</h2>
        <p>El precio pertenece a una presentación vendible.</p>
      </div>
      <button class="close-btn" type="button" (click)="close.emit()" aria-label="Cerrar formulario">
        <lucide-icon [img]="CloseIcon" [size]="18" [strokeWidth]="2.4"></lucide-icon>
      </button>
    </header>

    <form class="product-form" (ngSubmit)="submit()">
      <div class="form-grid">
        <label class="form-field full">
          <span>Presentación</span>
          <select name="presentacion" [(ngModel)]="form.id_presentacion" required>
            <option [ngValue]="0" disabled>Selecciona una presentación</option>
            <option *ngFor="let presentacion of presentaciones" [ngValue]="presentacion.id_presentacion">
              {{ getPresentationLabel(presentacion) }}
            </option>
          </select>
        </label>
        <label class="form-field">
          <span>Precio venta</span>
          <input name="precio_venta" type="number" min="0" step="0.01" [(ngModel)]="form.precio_venta" required>
        </label>
        <label class="form-field">
          <span>Precio compra</span>
          <input name="precio_compra" type="number" min="0" step="0.01" [(ngModel)]="form.precio_compra">
        </label>
        <label class="form-field">
          <span>Precio mayorista</span>
          <input name="precio_mayorista" type="number" min="0" step="0.01" [(ngModel)]="form.precio_mayorista">
        </label>
        <label class="form-field">
          <span>Cant. mín. mayorista</span>
          <input name="cantidad_minima_mayorista" type="number" min="0" step="0.001" [(ngModel)]="form.cantidad_minima_mayorista">
        </label>
        <label class="form-field">
          <span>Moneda</span>
          <input name="moneda" type="text" maxlength="3" [(ngModel)]="form.moneda">
        </label>
        <label class="form-field checkbox-field">
          <span>Impuestos</span>
          <label class="form-check">
            <input name="incluye_igv" type="checkbox" [(ngModel)]="form.incluye_igv">
            <span>Incluye IGV</span>
          </label>
        </label>
      </div>
      <footer class="form-actions">
        <button class="form-btn ghost" type="button" (click)="close.emit()">Cancelar</button>
        <button class="form-btn primary" type="submit" [disabled]="!form.id_presentacion">
          <lucide-icon [img]="SaveIcon" [size]="16" [strokeWidth]="2.4"></lucide-icon>
          Guardar precio
        </button>
      </footer>
    </form>
  </section>
</div>
