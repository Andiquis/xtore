<div class="product-form-backdrop" (click)="close.emit()">
  <section class="product-form-modal" (click)="$event.stopPropagation()">
    <header class="form-header">
      <div>
        <span class="form-eyebrow">{{ mode === 'create' ? 'Nueva presentación' : 'Editar presentación' }}</span>
        <h2>{{ mode === 'create' ? 'Añadir presentación' : 'Editar presentación' }}</h2>
        <p>Registra los datos de la presentación para asociarla a productos.</p>
      </div>

      <button class="close-btn" type="button" (click)="close.emit()" aria-label="Cerrar formulario">
        <lucide-icon [img]="CloseIcon" [size]="18" [strokeWidth]="2.4"></lucide-icon>
      </button>
    </header>

    <form class="product-form" (ngSubmit)="submit()">
      <div class="form-grid">
        <label class="form-field">
          <span>Nombre</span>
          <input name="name" type="text" [(ngModel)]="form.name" placeholder="Nombre de la presentación" required>
        </label>

        <label class="form-field">
          <span>Estado</span>
          <select name="status" [(ngModel)]="form.status">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
        </label>

        <label class="form-field full">
          <span>Descripción</span>
          <input name="description" type="text" [(ngModel)]="form.description" placeholder="Descripción breve de la presentación">
        </label>
      </div>

      <footer class="form-actions">
        <button class="form-btn ghost" type="button" (click)="close.emit()">Cancelar</button>
        <button class="form-btn primary" type="submit">
          <lucide-icon [img]="SaveIcon" [size]="16" [strokeWidth]="2.4"></lucide-icon>
          Guardar presentación
        </button>
      </footer>
    </form>
  </section>
</div>
