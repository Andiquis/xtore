<div class="product-form-backdrop" (click)="close.emit()">
  <section class="product-form-modal" (click)="$event.stopPropagation()">
    <header class="form-header">
      <div>
        <span class="form-eyebrow">{{ mode === 'create' ? 'Nueva marca' : 'Editar marca' }}</span>
        <h2>{{ mode === 'create' ? 'Añadir marca' : 'Editar marca' }}</h2>
        <p>Registra los datos de la marca para asociarla a productos.</p>
      </div>

      <button class="close-btn" type="button" (click)="close.emit()" aria-label="Cerrar formulario">
        <lucide-icon [img]="CloseIcon" [size]="18" [strokeWidth]="2.4"></lucide-icon>
      </button>
    </header>

    <form class="product-form" (ngSubmit)="submit()">
      <div class="form-grid">
        <label class="form-field">
          <span>Nombre</span>
          <input name="name" type="text" [(ngModel)]="form.name" placeholder="Nombre de la marca" required>
        </label>

        <div class="form-field">
          <span>Logo de marca</span>
          <label class="image-upload-field">
            <input name="logo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" (change)="selectLogo($event)">
            <span class="image-upload-preview">
              <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa del logo">
              <lucide-icon *ngIf="!previewUrl" [img]="ImageIcon" [size]="22" [strokeWidth]="2.4"></lucide-icon>
            </span>
            <span class="image-upload-copy">
              <strong>{{ form.logoFile ? form.logoFile.name : 'Seleccionar imagen' }}</strong>
              <small>PNG, JPG, WEBP o SVG · Max. 2 MB</small>
            </span>
            <lucide-icon [img]="UploadIcon" [size]="16" [strokeWidth]="2.4"></lucide-icon>
          </label>
        </div>

        <label class="form-field full">
          <span>Descripción</span>
          <input name="description" type="text" [(ngModel)]="form.description" placeholder="Descripción breve de la marca">
        </label>
      </div>

      <footer class="form-actions">
        <button class="form-btn ghost" type="button" (click)="close.emit()">Cancelar</button>
        <button class="form-btn primary" type="submit">
          <lucide-icon [img]="SaveIcon" [size]="16" [strokeWidth]="2.4"></lucide-icon>
          Guardar marca
        </button>
      </footer>
    </form>
  </section>
</div>
