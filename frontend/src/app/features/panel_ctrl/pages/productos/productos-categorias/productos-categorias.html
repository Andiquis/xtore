<div class="fade-in">
  <div class="top-bar">
    <div class="search-section">
      <div class="search-box">
        <lucide-icon [img]="SearchIcon" [size]="18" class="icon-gray"></lucide-icon>
        <input type="text" placeholder="Buscar categoría...">
      </div>
    </div>
    <div class="actions-section">
      <button class="btn btn-primary">
        <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
        Nueva Categoría
      </button>
    </div>
  </div>

  <div class="grid-cards">
    <div class="model-card" *ngFor="let cat of categorias">
      <div class="icon-box" [style.background]="cat.bg" [style.color]="cat.color">
        <lucide-icon [img]="TabCategoriesIcon" [size]="24" [strokeWidth]="2.5"></lucide-icon>
      </div>
      <div class="info">
        <h3>{{ cat.name }}</h3>
        <p>{{ cat.count }} productos • <span [style.color]="cat.status === 'Visible' ? '#05cd99' : '#ff5b5b'">{{ cat.status }}</span></p>
      </div>
      <div class="card-actions">
        <button class="icon-btn btn-view" title="Ver detalles"><lucide-icon [img]="EyeIcon" [size]="16"></lucide-icon></button>
        <button class="icon-btn btn-edit" title="Editar"><lucide-icon [img]="EditIcon" [size]="16"></lucide-icon></button>
        <button class="icon-btn btn-danger" title="Eliminar"><lucide-icon [img]="TrashIcon" [size]="16"></lucide-icon></button>
      </div>
    </div>
  </div>
</div>
