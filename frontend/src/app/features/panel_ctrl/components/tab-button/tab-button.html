<nav class="product-tabs panel-ctrl theme-light" [attr.aria-label]="ariaLabel">
  @for (tab of tabs; track tab.id) {
    <button
      type="button"
      class="tab-trigger"
      [class.active]="activeTab === tab.id"
      [attr.aria-current]="activeTab === tab.id ? 'page' : null"
      (click)="selectTab(tab)"
    >
      @if (tab.icon) {
        <span class="tab-icon">
          <lucide-icon [img]="tab.icon" [size]="18" [strokeWidth]="2.4"></lucide-icon>
        </span>
      }

      <span class="tab-label">{{ tab.label }}</span>
    </button>
  }
</nav>
